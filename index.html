    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />

    <title>Mahammad Rashik — Frontend Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Mahammad Rashik, a Frontend Web Developer from Ujire, Mangalore building fast, accessible interfaces with Next.js, Express.js, HTML, CSS and UI design."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        const saved = localStorage.getItem('mr-theme')
        const dark = saved ? saved === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
